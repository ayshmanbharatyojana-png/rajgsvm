
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Indicators | Ayodhya</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;
  background:#eef3f7;color:#243447;
  min-height:100vh;display:grid;place-items:center;
}
.container{
  width:min(420px,92%);background:white;
  border-radius:16px;overflow:hidden;
  box-shadow:0 12px 40px #152b4020;
}
.header{
  background:#102b46;color:white;
  text-align:center;padding:32px 20px;
}
.header h2{margin:10px 0 5px}
.header p{margin:0;color:#c9dbe9}
.content{padding:28px}
label{display:block;margin:15px 0 7px;font-size:14px}
input{
  width:100%;padding:13px;border:1px solid #ccd6df;
  border-radius:7px;font-size:15px;
}
button{
  width:100%;padding:14px;border:0;border-radius:7px;
  background:#176b87;color:white;font-size:15px;
  cursor:pointer;margin-top:18px;
}
button:disabled{opacity:.6;cursor:wait}
.link{text-align:right;margin-top:12px}
.link button{
  width:auto;background:none;color:#176b87;
  padding:5px;margin:0;font-size:13px;
}
.message{font-size:13px;margin-top:14px;line-height:1.5}
footer{text-align:center;color:#718096;font-size:12px;margin-top:24px}
.dashboard{width:min(850px,94%);padding:28px}
.dashboard h2{color:#102b46}
.cards{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:15px;margin-top:25px
}
.card{padding:22px;border:1px solid #dce4eb;border-radius:10px}
.hidden{display:none}
</style>
</head>
<body>

<div class="container" id="loginPanel">
  <div class="header">
    <div style="font-size:36px">♥</div>
    <h2>HEALTH INDICATORS</h2>
    <p>AYODHYA DISTRICT</p>
  </div>
  <div class="content">
    <h3>Administrator Login</h3>
    <form id="loginForm">
      <label>Email Address</label>
      <input id="email" type="email" required
        placeholder="Enter your email">

      <label>Password</label>
      <input id="password" type="password" required
        placeholder="Enter your password">

      <button id="loginButton" type="submit">SIGN IN</button>
    </form>

    <div class="link">
      <button id="resetButton" type="button">Forgot password?</button>
    </div>
    <div id="message" class="message" role="status"></div>
    <footer>Authorized users only</footer>
  </div>
</div>

<div class="container dashboard hidden" id="dashboard">
  <h2>Health Indicators Dashboard</h2>
  <p id="welcome"></p>
  <div class="cards">
    <div class="card">Maternal Health</div>
    <div class="card">Child Health</div>
    <div class="card">Immunization</div>
    <div class="card">Family Planning</div>
    <div class="card">NCD Indicators</div>
    <div class="card">Communicable Diseases</div>
    <div class="card">ASHA Indicators</div>
    <div class="card">Health Facility Indicators</div>
  </div>
  <button id="logoutButton">SIGN OUT</button>
</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
  getAuth, signInWithEmailAndPassword,
  sendPasswordResetEmail, onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

import {
  getFirestore, doc, getDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

// Replace with your actual Firebase web app configuration.
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "health-indicators-ayodhya.firebaseapp.com",
  projectId: "health-indicators-ayodhya",
  storageBucket: "health-indicators-ayodhya.firebasestorage.app",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginPanel = document.getElementById("loginPanel");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

function showMessage(text, error=false) {
  message.textContent = text;
  message.style.color = error ? "#c0392b" : "#16834a";
}

async function loadProfile(user) {
  const profile = await getDoc(doc(db, "users", user.uid));

  if (!profile.exists() ||
      profile.data().role !== "admin" ||
      profile.data().active !== true) {
    await signOut(auth);
    showMessage("Access denied. Contact administrator.", true);
    return;
  }

  loginPanel.classList.add("hidden");
  dashboard.classList.remove("hidden");
  document.getElementById("welcome").textContent =
    "Welcome, " + (profile.data().name || user.email);
}

document.getElementById("loginForm")
.addEventListener("submit", async (event) => {
  event.preventDefault();
  loginButton.disabled = true;
  showMessage("Signing in...");

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const result = await signInWithEmailAndPassword(
      auth, email, password
    );
    await loadProfile(result.user);

  } catch (error) {
    showMessage("Login failed: " + error.message, true);
  } finally {
    loginButton.disabled = false;
  }
});

document.getElementById("resetButton")
.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();

  if (!email) {
    showMessage("Enter your email address first.", true);
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showMessage("Password reset email sent.");
  } catch (error) {
    showMessage(error.message, true);
  }
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    loginPanel.classList.remove("hidden");
    dashboard.classList.add("hidden");
    return;
  }

  try {
    await loadProfile(user);
  } catch (error) {
    await signOut(auth);
    showMessage("Unable to verify your account.", true);
  }
});

document.getElementById("logoutButton")
.addEventListener("click", () => signOut(auth));
</script>
</body>
</html>
Create Health Indicators login page
